name: 오늘의 메이크박스 자동 갱신

on:
  schedule:
    # 비상용 — 매시간 갱신은 cron-job.org가 해요. 이건 그게 멈췄을 때를 대비한 하루 두 번
    # 한국시간 아침 6시 23분, 저녁 7시 37분 (GitHub이 덜 바쁜 시간, 정각 피함)
    - cron: "23 21 * * *"
    - cron: "37 10 * * *"
  workflow_dispatch:   # Actions 화면의 'Run workflow' 버튼으로 바로 실행

permissions:
  contents: write

concurrency:
  group: today-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 날씨·업계 소식·시세 가져오기
        run: python3 .github/scripts/today_update.py
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          KAMIS_KEY: ${{ secrets.KAMIS_KEY }}
          KAMIS_ID: ${{ secrets.KAMIS_ID }}
      - name: 바뀐 내용 저장
        run: |
          git config user.name "today-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flipbook/today-data.json
          git diff --cached --quiet || (git commit -m "오늘의 메이크박스 데이터 갱신" && (git push || (git pull --rebase && git push)))
