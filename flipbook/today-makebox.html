    <div id="t2" class="hide"><div id="news"></div><div class="src" id="nmeta"></div></div>
  </section>

  <footer>메이크박스 · 레츠에코 &nbsp;|&nbsp; 다음 장부터 제품 카탈로그가 시작돼요 ›</footer>
</div>

<script>
var WD=["일","월","화","수","목","금","토"];
var now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
document.getElementById("today").textContent=now.getFullYear()+"년 "+(now.getMonth()+1)+"월 "+now.getDate()+"일 "+WD[now.getDay()]+"요일";
var h=now.getHours();
document.getElementById("hello").textContent=h<11?"좋은 아침이에요. 오늘도 맛있는 떡 많이 파세요 ☀️":h<17?"바쁜 오후, 잠깐 쉬어가세요 🍵":"오늘도 수고 많으셨어요 🌙";

/* D-day */
var up=EVENTS.map(function(e){var p=e[0].split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);return {d:d,name:e[1],tip:e[2],n:Math.round((d-t0)/864e5)};})
  .filter(function(e){return e.n>=0;}).sort(function(a,b){return a.n-b.n;});
var dm=document.getElementById("dmain"),dl=document.getElementById("dlist");
if(up.length){
  var f=up[0];
  dm.innerHTML='<span class="ev">'+f.name+'</span><span class="d">'+(f.n===0?"D-DAY":"D-"+f.n)+'</span><span class="tip">'+f.tip+' 준비하실 때예요</span>';
  dl.innerHTML=up.slice(1,4).map(function(e){return '<div><span>'+e.name+' <small style="color:#8a7f72">('+(e.d.getMonth()+1)+'/'+e.d.getDate()+')</small></span><span>D-'+e.n+'</span></div>';}).join("");
}else{dm.innerHTML='<span class="tip">등록된 일정이 없어요</span>';}

/* 시세 */
function siseRender(list,dateTxt,demo){
  document.getElementById("sise").innerHTML=list.map(function(s){
    var c=/▲/.test(s[2])?"#c0552b":/▼/.test(s[2])?"#2f6db5":"";
    return "<tr><td>"+esc(s[0])+"</td><td>"+esc(s[1])+"</td><td"+(c?' style="color:'+c+'"':"")+">"+esc(s[2])+"</td></tr>";}).join("");
  document.getElementById("sdate").textContent=dateTxt;
  document.getElementById("sbadge").className=demo?"badge":"hide";
}

/* 이달의 떡 */
var STORY=[
 ["🥢","가래떡","길게 뽑아 오래 살라는 뜻, 동그랗게 썰어 엽전처럼 재물이 들라는 뜻을 담아요."],
 ["🌕","약식","정월대보름에 오곡밥과 함께 먹던 떡. 찹쌀에 꿀·대추·밤을 넣어 '약'이라 불렀어요."],
 ["🌸","진달래 화전","삼짇날 봄꽃을 얹어 지져 먹던 떡. 봄을 접시에 올리는 방법이었죠."],
 ["🌿","쑥떡","이른 봄 어린 쑥으로 만든 떡. 향긋한 봄맛의 대표 주자예요."],
 ["💐","답례떡","어버이날·스승의날, 고마운 마음을 떡 한 상자에 담아 전해요."],
 ["🛞","수리취떡","단오에 먹던 떡. 수레바퀴 무늬를 찍어 '차륜병'이라고도 불러요."],
 ["☁️","증편","막걸리로 부풀린 떡. 더운 여름에도 잘 쉬지 않아 여름 떡으로 사랑받았어요."],
 ["🤍","백설기","흰 무리떡은 티 없이 깨끗하게 자라라는 바람을 담아 백일상에 올려요."],
 ["🌓","송편","추석의 떡. 솔잎 향을 입혀 찌고, 반달 모양에 앞날이 차오르길 빌었어요."],
 ["🏠","시루떡","10월 상달, 집안의 평안을 빌며 고사에 올리던 떡이에요."],
 ["🎓","찹쌀떡","'척 붙어라!' 시험을 앞둔 이들에게 건네는 응원의 떡이에요."],
 ["🔴","팥시루떡 · 팥죽","동지에는 붉은 팥으로 나쁜 기운을 쫓는다고 믿었어요."]
][now.getMonth()];
document.getElementById("story").innerHTML='<div class="ico">'+STORY[0]+'</div><div><b>'+(now.getMonth()+1)+'월의 떡 · '+STORY[1]+'</b><p>'+STORY[2]+'</p></div>';

/* 이달의 시 · 수필 */
var PM=POEMS[now.getMonth()];
document.getElementById("t0").innerHTML=PM[0].replace(/&/g,"&amp;").replace(/</g,"&lt;")+"<small>"+PM[1]+"</small>";
document.getElementById("essay").textContent=ESSAYS[now.getMonth()];

function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* 날씨 롤링 */
var WXI={"맑음":"☀️","구름많음":"⛅","흐림":"☁️","비":"🌧️","비/눈":"🌨️","눈":"❄️","소나기":"🌦️"};
var wxT=null;
function wxRender(list,meta,demo){
  if(!list||!list.length)return;
  var ul=document.getElementById("wxul");
  var row=function(w){return '<li><span class="rg">'+esc(w[0])+'</span><span class="ic">'+(WXI[w[1]]||"🌡️")+'</span><span class="sk">'+esc(w[1])+'</span><span class="tp">'+esc(w[2])+'°</span></li>';};
  ul.innerHTML=list.map(row).join("")+row(list[0]);
  ul.style.transition="none";ul.style.transform="translateY(0)";
  document.getElementById("wxmeta").textContent=meta||"";
  document.getElementById("wbadge").className=demo?"badge":"hide";
  var i=0;if(wxT)clearInterval(wxT);
  wxT=setInterval(function(){
    i++;ul.style.transition="transform .6s ease";ul.style.transform="translateY(-"+(ul.children[i].getBoundingClientRect().top-ul.getBoundingClientRect().top)+"px)";
    if(i>=list.length){setTimeout(function(){ul.style.transition="none";ul.style.transform="translateY(0)";i=0;},650);}
  },2600);
}
wxRender(WX_DEMO,"예시 화면 · 자동 연결 전",true);
siseRender(SISE.map(function(s){return [s.name,s.price,s.diff];}),SISE_DATE.replace(/-/g,".")+" 기준",SISE_SAMPLE);

/* 업계 소식 */
function newsRender(list,meta){
  document.getElementById("news").innerHTML=list.map(function(n){
    return '<a class="nw" href="'+esc(n[4])+'" target="_blank" rel="noopener"><b><span class="nc'+(/제지|포장/.test(n[0])?' p':'')+'">'+esc(n[0])+'</span>'+esc(n[1])+'</b><small>'+esc(n[2])+' · '+esc(String(n[3]).replace(/-/g,"."))+'</small></a>';
  }).join("");
  document.getElementById("nmeta").textContent=meta;
}
newsRender(NEWS,"제목을 누르면 기사 원문이 새 창으로 열려요");

/* 자동 갱신 데이터 (GitHub이 하루 몇 번 만들어 둔 today-data.json) */
try{
  fetch("today-data.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d)return;
    if(d.weather&&d.weather.length)wxRender(d.weather,"기상청 예보 · "+(d.wx_time||""),false);
    if(d.sise&&d.sise.length)siseRender(d.sise,(d.sise_time||"")+" 기준 · 소매 전국평균 · 한 달 전 대비",false);
    if(d.news&&d.news.length)newsRender(d.news,"네이버 뉴스 검색 · "+(d.news_time||"")+" 갱신 · 제목을 누르면 원문이 열려요");
  }).catch(function(){});
}catch(e){}

/* 확대 — 손가락 두 개로 벌리기 · 마우스 휠 · 두 번 누르기(두 번 클릭) / 확대 중엔 끌어서 이동 */
(function(){
  var W=document.querySelector(".wrap"),s=1,x=0,y=0,MAX=4,moved=false;
  var R=document.createElement("button");
  R.textContent="↺ 원래 크기";R.setAttribute("type","button");
  R.style.cssText="position:fixed;right:12px;bottom:12px;z-index:9;display:none;border:0;border-radius:2em;padding:.55em 1.1em;font-weight:800;font-size:15px;line-height:1;font-family:inherit;background:rgba(43,38,34,.82);color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)";
  document.body.appendChild(R);
  W.style.transformOrigin="0 0";
  document.documentElement.style.touchAction="pan-y";
  function ap(an){
    W.style.transition=an?"transform .25s ease":"none";
    W.style.transform=(s===1&&x===0&&y===0)?"":"translate("+x+"px,"+y+"px) scale("+s+")";
    document.body.style.overflow=s>1?"hidden":"";
    document.documentElement.style.touchAction=s>1?"none":"pan-y";
    R.style.display=s>1?"block":"none";
  }
  function clamp(){
    var w=W.offsetWidth,h=W.offsetHeight;
    x=Math.min(0,Math.max(w-w*s,x));y=Math.min(0,Math.max(h-h*s,y));
  }
  function zoomAt(ns,cx,cy,an){
    ns=Math.max(1,Math.min(MAX,ns));
    var r=W.getBoundingClientRect(),ux=(cx-r.left)/s,uy=(cy-r.top)/s;
    x+=(cx-ux*ns)-r.left;y+=(cy-uy*ns)-r.top;s=ns;
    if(s<=1.01){s=1;x=0;y=0;}
    clamp();ap(an);
  }
  R.addEventListener("click",function(e){e.stopPropagation();s=1;x=0;y=0;ap(true);});
  /* 마우스 휠 */
  window.addEventListener("wheel",function(e){
    var canScroll=document.documentElement.scrollHeight>innerHeight+2;
    if(s===1&&canScroll&&!e.ctrlKey&&e.deltaY>0)return;            /* 긴 화면은 아래로 굴리면 스크롤 */
    if(s===1&&canScroll&&!e.ctrlKey&&e.deltaY<0&&scrollY>0)return;
    e.preventDefault();
    zoomAt(s*Math.exp(-e.deltaY*0.0012),e.clientX,e.clientY,false);
  },{passive:false});
  /* 두 번 클릭 */
  window.addEventListener("dblclick",function(e){
    if(e.target.closest("a,button"))return;
    e.preventDefault();if(getSelection)try{getSelection().removeAllRanges();}catch(_){}
    zoomAt(s>1?1:2.5,e.clientX,e.clientY,true);
  });
  /* 마우스로 끌기 */
  var drag=null;
  window.addEventListener("mousedown",function(e){if(s>1&&e.button===0){drag={x:e.clientX,y:e.clientY,ox:x,oy:y};moved=false;e.preventDefault();}});
  window.addEventListener("mousemove",function(e){if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;x=drag.ox+dx;y=drag.oy+dy;clamp();ap(false);});
  window.addEventListener("mouseup",function(){drag=null;});
  /* 손가락 */
  var t=null,lastTap=0,lastX=0,lastY=0;
  function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
  window.addEventListener("touchstart",function(e){
    if(e.touches.length===2){t={pinch:true,d:dist(e.touches[0],e.touches[1]),s:s};moved=true;e.preventDefault();}
    else if(e.touches.length===1){var p=e.touches[0];t={pinch:false,x:p.clientX,y:p.clientY,ox:x,oy:y,sx:p.clientX,sy:p.clientY};moved=false;}
  },{passive:false});
  window.addEventListener("touchmove",function(e){
    if(!t)return;
    if(t.pinch&&e.touches.length===2){
      e.preventDefault();var a=e.touches[0],b=e.touches[1];
      zoomAt(t.s*dist(a,b)/t.d,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2,false);
    }else if(!t.pinch&&s>1&&e.touches.length===1){
      e.preventDefault();var p=e.touches[0],dx=p.clientX-t.x,dy=p.clientY-t.y;
      if(Math.abs(p.clientX-t.sx)+Math.abs(p.clientY-t.sy)>8)moved=true;
      x=t.ox+dx;y=t.oy+dy;clamp();ap(false);
    }else if(!t.pinch){var q=e.touches[0];if(Math.abs(q.clientX-t.sx)+Math.abs(q.clientY-t.sy)>8)moved=true;}
  },{passive:false});
  window.addEventListener("touchend",function(e){
    if(t&&!t.pinch&&!moved&&e.changedTouches.length===1){
      var p=e.changedTouches[0],now=Date.now();
      if(now-lastTap<320&&Math.abs(p.clientX-lastX)<30&&Math.abs(p.clientY-lastY)<30&&!(e.target.closest&&e.target.closest("a,button"))){
        e.preventDefault();zoomAt(s>1?1:2.5,p.clientX,p.clientY,true);lastTap=0;
      }else{lastTap=now;lastX=p.clientX;lastY=p.clientY;}
    }
    if(e.touches.length===0)t=null;
  },{passive:false});
  /* 끌기·벌리기 뒤에는 링크가 눌리지 않게 */
  window.addEventListener("click",function(e){if(moved){e.preventDefault();e.stopPropagation();moved=false;}},true);
  window.addEventListener("resize",function(){clamp();ap(false);});
})();

function tab(i){[0,1,2].forEach(function(k){document.getElementById("t"+k).className=k===i?(k===0?"poem":""):"hide";document.querySelectorAll(".tabs button")[k].className=k===i?"on":"";});}
</script>
</body>
